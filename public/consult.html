<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文章で相談する | SAM</title><style>*{box-sizing:border-box}body{background:#f4f5ef;color:#173c36;font:16px/1.8 system-ui,sans-serif;margin:0}main{max-width:780px;margin:auto;padding:32px 22px}h1{font-size:clamp(30px,6vw,46px);line-height:1.4}a{color:inherit}form,.result{background:white;padding:26px;border-radius:14px;margin:24px 0}label{display:block;font-weight:700;margin-top:20px}input,textarea,select{width:100%;padding:12px;border:1px solid #9bac9d;border-radius:5px;font:inherit;color:inherit;background:white}textarea{resize:vertical}button,.button{display:inline-block;border:0;border-radius:6px;background:#173c36;color:white;padding:13px 18px;font:inherit;cursor:pointer;margin:18px 8px 0 0;text-decoration:none}small{display:block;color:#55675d}.result textarea{min-height:240px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a5bc47;outline-offset:3px}[hidden]{display:none!important}</style></head><body><main><a href="index.html">← サービス紹介に戻る</a><h1>いまの相談の流れを、<br>文章で教えてください。</h1><p>わかる範囲の入力から、相談メールの下書きを作れます。電話・オンライン会議は不要です。</p><small>入力時点では送信・保存されません。お客様の個人情報やパスワードは入力しないでください。</small><form id="consult"><label for="business">事業・サービス内容</label><input id="business" name="business" maxlength="100" required placeholder="例：エアコンクリーニング"><label for="website">現在のサイトURL（任意）</label><input id="website" name="website" type="url" maxlength="250" placeholder="https://"><label for="problem">困っているやり取り</label><textarea id="problem" name="problem" rows="4" maxlength="600" required placeholder="例：型番と対応地域を毎回聞き直しています。"></textarea><label for="volume">月の相談件数</label><select id="volume" name="volume"><option>不明</option><option>0〜9件</option><option>10〜29件</option><option>30件以上</option></select><label for="timing">希望時期・補足（任意）</label><textarea id="timing" name="timing" maxlength="250" rows="2"></textarea><button type="submit">相談文を作る</button><small>この操作で契約や料金の支払いは発生しません。</small></form><section id="preview" class="result" hidden><h2>内容を確認して送信</h2><label for="body">編集できる相談文</label><textarea id="body"></textarea><button type="button" id="email">メールアプリを開く</button><button type="button" id="copy">文章をコピー</button><p id="status" role="status" aria-live="polite"></p><small>メールアプリで内容を確認し、ご自身で送信してください。開かない場合は、文章をコピーして rabbitusausa307@gmail.com 宛てに送れます。いただいた連絡先は相談への返信に使用します。</small></section><noscript><p>JavaScriptが無効です。事業内容・サイトURL・困りごとを、rabbitusausa307@gmail.com へメールしてください。</p></noscript><footer><p>SAM / 佐藤蒼真 / 広島県</p></footer></main><script src="consult.js"></script></body></html>
